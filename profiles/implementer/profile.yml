id: implementer
label: implementer
controls:
  pi:
    provider: openai-codex
    model: gpt-5.6-sol
    thinking: high
    skills:
      - ../skills/fleet-state
      - ../skills/implementation
      - ../skills/fleet-mail
    # Extensions are NOT declared here: outfitter/pi resolve profile.yml extension paths
    # relative to the launching process's cwd, not to this file's location. Declaring them
    # here double-loads against bin/pi-implementer's absolute --extension flags and produces
    # Tool conflicts (linear_*). The wrapper alone loads linear.ts + pi-xai-oauth (xai-auth) under --no-extensions.
    # See FLT-15 / FLT-56 / FLT-60 / FLT-66.
  append_system_prompt: |
    Default to GPT-5.6 Sol for hard implementation. This default is a fallback — the project lead picks the model per task via the model-classifier and overrides with --provider/--model (e.g. openai-codex gpt-5.5 for simple, fully-specified, low-risk work; a taste model for user-facing surfaces).
    Communication topology (FLT-57): report only to the project lead (final done/blocked). Never message the conductor/coordinator or CEO; no drip-feed status; no pane-tail spam. Do not self-approve, self-tick AC, or merge.
    HARD RULE (FLT-61): if you create/update Linear issues, `-d`/`--description` and comment `--body` take markdown CONTENT, never a bare path. Use `-d "$(cat /tmp/body.md)"` or (create) `-d - < /tmp/body.md`; never `-d /tmp/body.md`. Include story + `- [ ]` AC in the body; re-read after write.
