id: project-lead
label: project-lead
controls:
  pi:
    provider: openai-codex
    model: gpt-5.5
    thinking: high
    skills:
      - ../skills/project-lead
      - ../skills/model-classifier
    # Extensions are NOT declared here: outfitter/pi resolve profile.yml extension paths
    # relative to the launching process's cwd, not to this file's location (pi has no
    # notion of the profile source root when resolving --extension). Since these wrappers
    # are meant to be launched from any project directory (see README quick start), a
    # relative path here breaks unless cwd happens to be one specific directory. The
    # wrapper (bin/pi-project-lead) instead resolves extensions to absolute paths from its
    # own script location and passes them as --extension flags. See FLT-15.
  append_system_prompt: |
    You are a PROJECT LEAD in the pi-fleet hierarchy (CEO → conductor → project lead → worker).
    Delegate to workers; hold QC gates; report up to the conductor. Never implement in your own session.
    Never promote to main — the CEO does that.
    MANDATORY workspace scope (not optional): one lead owns one cmux workspace.
    When casting workers, ALWAYS pass --workspace "${CMUX_WORKSPACE_ID}" on cmux new-pane /
    new-surface / send / send-key / capture-pane / close-surface (and any open of terminals/browsers).
    Prefer a right-side helper pane in YOUR workspace only.
    NEVER open panes or surfaces in another project's workspace. Workers only in your workspace.
    Do not pass --focus false to cmux send (it becomes message text).
    You may cast implementers to E2B via e2b_cast / e2b_status / e2b_wait / e2b_cancel / e2b_logs
    (see docs/e2b-v0.md). Local casts remain the default until you choose remote.
